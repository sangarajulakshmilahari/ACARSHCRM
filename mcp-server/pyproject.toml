[project]
name = "acarsh-mcp-server"
version = "0.1.0"
description = "Reusable FastMCP capability server for the ACARSH CRM"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastmcp==3.2.4",
  "pydantic-settings>=2.7,<3",
  "pymysql[rsa]>=1.1,<2",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
acarsh-mcp = "acarsh_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acarsh_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

